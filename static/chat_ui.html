<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talk to my CV</title>
  <script>
    // Apply the saved theme before first paint (default: dark) so there's no light flash.
    (function () {
      var theme = "dark";
      try { theme = localStorage.getItem("jobhunt_theme") || "dark"; } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <style>
    :root{
      --ink:#14171C;
      --panel:#1B1F27;
      --panel-raised:#232833;
      --line:#2C3140;
      --gold:#C9A961;
      --gold-dim:#8A7A4E;
      --text:#E9E7E1;
      --text-dim:#8B909C;
      --match-high:#6FA287;
      --match-mid:#C9A961;
      --match-low:#B3705E;
      --radius:10px;
    }
    /* Day theme (dark is the default above); shares the app's saved choice. */
    :root[data-theme="light"]{
      --ink:#F5F6F8;
      --panel:#FFFFFF;
      --panel-raised:#EEF0F3;
      --line:#DDE1E7;
      --gold:#C9A961;
      --gold-dim:#9C7E3C;
      --text:#14171C;
      --text-dim:#5B6270;
      --match-high:#2F7A55;
    }
    :root[data-theme="light"] .brand span, :root[data-theme="light"] #new-chat{color:#7A5C14;}
    #theme-btn{flex:none; width:34px; height:34px; border-radius:50%; border:1px solid var(--line); background:var(--panel); color:var(--text); display:grid; place-items:center; cursor:pointer;}
    #topbar-right{display:flex; align-items:center; gap:10px;}
    *{box-sizing:border-box;} html,body{height:100%;}
    button, input, textarea, select{font-family:inherit;} /* form controls don't inherit fonts by default */
    body{margin:0; background:var(--ink); color:var(--text); font-family:"Times New Roman", Times, serif; display:flex; overflow:hidden;}
    #sidebar{width:264px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:20px 14px;}
    .brand{font-size:19px; font-weight:600; padding:2px 8px 4px; }
    .brand span{color:var(--gold);}
    .brand-sub{padding:0 8px 18px; font-size:12px; color:var(--text-dim); }
    #new-chat{background:transparent; border:1px solid var(--gold-dim); color:var(--gold); border-radius:var(--radius); padding:9px 12px; cursor:pointer; margin-bottom:16px;}
    #convo-list{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:2px;}
    .convo-item{padding:9px 10px; border-radius:8px; font-size:13px; color:var(--text-dim); cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    .convo-item:hover{background:var(--panel-raised); color:var(--text);}
    .convo-item.active{background:var(--panel-raised); color:var(--text); border-left:2px solid var(--gold); padding-left:8px;}
    #settings-btn{margin-top:10px; background:none; border:none; color:var(--text-dim); font-size:12px; cursor:pointer; text-align:left; padding:8px;}
    #main{flex:1; display:flex; flex-direction:column; min-width:0;}
    #topbar{height:56px; border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; padding:0 24px; flex-shrink:0;}
    #topbar h1{font-size:15px; color:var(--text-dim); margin:0;}
    #status-pill{font-size:11px; color:var(--text-dim); border:1px solid var(--line); padding:4px 10px; border-radius:999px;}
    #status-pill.live{color:var(--match-high); border-color:rgba(111,162,135,0.4);}
    #thread{flex:1; overflow-y:auto; padding:28px 0 12px; display:flex; flex-direction:column; gap:18px;}
    .row{display:flex; padding:0 8%;}
    .row.user{justify-content:flex-end;}
    .bubble{max-width:640px; padding:12px 16px; border-radius:var(--radius); font-size:14.5px; line-height:1.55;}
    .row.user .bubble{background:var(--gold); color:#20180B; border-bottom-right-radius:3px;}
    .row.assistant .bubble{background:var(--panel); border:1px solid var(--line); color:var(--text); border-bottom-left-radius:3px;}
    #composer{padding:16px 8% 22px; flex-shrink:0;}
    #composer-inner{display:flex; align-items:flex-end; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:8px 8px 8px 16px;}
    #msg-input{flex:1; background:none; border:none; outline:none; resize:none; color:var(--text); font-family:inherit; font-size:14.5px; line-height:1.5; max-height:160px; padding:8px 0;}
    #msg-input::placeholder{color:var(--text-dim);}
    #send-btn{background:var(--gold); color:#20180B; border:none; width:36px; height:36px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center;}
    #send-btn:disabled{opacity:.35; cursor:default;}
    #composer-hint{font-size:11px; color:var(--text-dim); text-align:center; margin-top:8px;}
    #overlay{position:fixed; inset:0; background:rgba(10,11,14,0.6); display:none; align-items:center; justify-content:center; z-index:10;}
    #overlay.open{display:flex;}
    #settings-modal{background:var(--panel); border:1px solid var(--line); border-radius:12px; width:380px; padding:22px;}
    #settings-modal h3{margin:0 0 14px;}
    .field{margin-bottom:14px;}
    .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px;}
    .field input{width:100%; background:var(--panel-raised); border:1px solid var(--line); border-radius:7px; padding:9px 10px; color:var(--text); font-size:13px;}
    #settings-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:6px;}
    #settings-actions button{font-family:inherit; font-size:13px; padding:8px 14px; border-radius:7px; cursor:pointer; border:1px solid var(--line); background:none; color:var(--text-dim);}
    #settings-save{background:var(--gold); color:#20180B; border:none; font-weight:500;}
    .suggestions{display:flex; flex-direction:column; gap:8px; margin-top:18px;}
    .suggestion{background:var(--panel); border:1px solid var(--line); color:var(--text-dim); padding:10px 14px; border-radius:8px; cursor:pointer; text-align:left;}
    #empty-state{margin:auto; text-align:center; color:var(--text-dim); max-width:420px; padding:0 20px;}
    #empty-state h2{color:var(--text); font-size:22px; margin-bottom:8px;}
    .bubble{overflow-wrap:anywhere;}
    .bubble a{color:inherit;}
    #topbar-left{display:flex; align-items:center; gap:10px; min-width:0;}
    #topbar h1{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    #menu-btn, #drawer-backdrop{display:none;}

    /* ---------- phones & small tablets: sidebar becomes a slide-out drawer ---------- */
    @media (max-width: 768px){
      html, body{height:100%; height:100dvh;}
      #sidebar{position:fixed; inset:0 auto 0 0; width:min(82vw, 300px); z-index:20; transform:translateX(-100%); transition:transform .22s ease; padding-top:calc(20px + env(safe-area-inset-top)); padding-bottom:calc(14px + env(safe-area-inset-bottom));}
      body.drawer-open #sidebar{transform:none; box-shadow:0 0 40px rgba(0,0,0,.5);}
      #drawer-backdrop{position:fixed; inset:0; background:rgba(10,11,14,.55); z-index:15;}
      body.drawer-open #drawer-backdrop{display:block;}
      #menu-btn{display:flex; align-items:center; justify-content:center; flex:none; width:40px; height:40px; margin-left:-8px; background:none; border:none; color:var(--text); border-radius:8px; cursor:pointer;}
      #topbar{height:auto; min-height:52px; padding:calc(6px + env(safe-area-inset-top)) 12px 6px;}
      #topbar h1{font-size:15px; color:var(--text);}
      #status-pill{font-size:10px; padding:3px 8px; flex:none;}
      #thread{padding:16px 0 8px; gap:14px;}
      .row{padding:0 12px;}
      .bubble{max-width:85%; font-size:15px; padding:10px 14px;}
      .row.assistant{flex-direction:column; align-items:flex-start; gap:4px;} /* sources line stacks under the answer */
      #composer{padding:8px 10px calc(10px + env(safe-area-inset-bottom));}
      #composer-inner{padding:6px 6px 6px 14px;}
      #msg-input{font-size:16px;} /* >=16px stops iOS zooming in on focus */
      #send-btn{width:40px; height:40px;}
      #composer-hint{display:none;}
      #empty-state{padding:0 16px;}
      #empty-state h2{font-size:20px;}
      .suggestion{min-height:44px; font-size:14px;}
      #settings-modal{width:calc(100vw - 32px); max-width:380px;}
    }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="brand" id="brand-name">Talk to <span>my CV</span></div>
    <div class="brand-sub">Talk to my CV</div>
    <button id="new-chat">+ New conversation</button>
    <div id="convo-list"></div>
    <button id="settings-btn">⚙ Connection settings</button>
  </div>

  <div id="main">
    <div id="topbar">
      <div id="topbar-left">
        <button id="menu-btn" type="button" aria-label="Open conversations" aria-controls="sidebar" aria-expanded="false">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <h1 id="convo-title">New conversation</h1>
      </div>
      <div id="topbar-right">
        <button id="theme-btn" type="button"></button>
        <span id="status-pill">not connected</span>
      </div>
    </div>

    <div id="thread">
      <div id="empty-state">
        <h2 id="es-title">Chat with my CV</h2>
        <p id="es-text">An AI assistant that answers from this candidate's CV. Ask about experience, skills, projects or education. Recruiters can leave an email to get in touch.</p>
        <div class="suggestions">
          <button class="suggestion" data-q="Hi!">Hi!</button>
          <button class="suggestion" data-q="Tell me about your experience">Tell me about your experience</button>
          <button class="suggestion" data-q="What projects have you built?">What projects have you built?</button>
          <button class="suggestion" data-q="How can I contact you?">How can I contact you?</button>
        </div>
      </div>
    </div>

    <div id="composer">
      <div id="composer-inner">
        <textarea id="msg-input" rows="1" placeholder="Ask me about my experience, skills or projects…"></textarea>
        <button id="send-btn" title="Send" aria-label="Send">➤</button>
      </div>
      <div id="composer-hint">Enter to send · Shift+Enter for a new line</div>
    </div>
  </div>

  <div id="drawer-backdrop"></div>

  <div id="overlay">
    <div id="settings-modal">
      <h3>Connection settings</h3>
      <div class="field">
        <label>API base URL</label>
        <input id="api-base" placeholder="leave blank to use this site's URL" />
      </div>
      <div class="field">
        <label>Username</label>
        <input id="jwt-token" placeholder="demo-user" />
      </div>
      <div id="settings-actions">
        <button id="settings-cancel">Cancel</button>
        <button id="settings-save">Save</button>
      </div>
    </div>
  </div>

  <script>
    (() => {
      const thread = document.getElementById('thread');
      const input = document.getElementById('msg-input');
      // Each browser gets its own anonymous id so visitors never see each other's
      // conversations (a shared default would list every recruiter's chats).
      function visitorId(){
        let id = null;
        try { id = localStorage.getItem('jobhunt_username'); } catch (_) {}
        if (!id || id === 'demo-user') {
          id = 'visitor-' + (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)).slice(0, 12);
          try { localStorage.setItem('jobhunt_username', id); } catch (_) {}
        }
        return id;
      }
      const sendBtn = document.getElementById('send-btn');
      const statusPill = document.getElementById('status-pill');
      const convoList = document.getElementById('convo-list');
      const apiBaseInput = document.getElementById('api-base');
      const jwtInput = document.getElementById('jwt-token');
      const overlay = document.getElementById('overlay');

      const state = {
        // Defaults to the page's own origin -- this page and the API are
        // served by the same FastAPI app, so this works unchanged whether
        // it's opened via localhost or a deployed URL (e.g. Render).
        apiBase: localStorage.getItem('jobhunt_api_base') || window.location.origin,
        username: visitorId(),
        conversationId: null,
      };

      function refreshStatus(){
        const ok = !!state.apiBase;
        statusPill.textContent = ok ? 'connected' : 'not connected';
        statusPill.classList.toggle('live', ok);
      }

      function authHeaders(){
        return {
          'Content-Type': 'application/json',
        };
      }

      // Whose CV this bot answers from: /chatbot?u=<username>; empty = the site's default candidate.
      const candidate = (new URLSearchParams(window.location.search).get('u') || '').trim().toLowerCase();
      let candidateName = '';

      function buildUserUrl(path){
        const url = new URL(path, state.apiBase + '/');
        url.searchParams.set('username', state.username);
        if (candidate) url.searchParams.set('u', candidate);
        return url.toString();
      }

      const escapeText = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      const firstName = () => (candidateName || '').split(' ')[0];
      const emptyTitle = () => firstName() ? `Chat with ${firstName()}` : 'Chat with my CV';
      const emptyText = () => (firstName() ? `An AI version of ${firstName()} that answers from their CV.` : "An AI assistant that answers from this candidate's CV.")
        + ' Ask about experience, skills, projects or education. Recruiters can leave an email to get in touch.';

      // Fill in whose bot this is, or explain that it isn't available.
      async function loadCandidate(){
        try {
          const res = await fetch(buildUserUrl('/chatbot/user-details'));
          if (!res.ok) throw new Error('unavailable');
          const data = await res.json();
          candidateName = data.full_name || data.username;
          const [first, ...rest] = candidateName.split(' ');
          document.getElementById('brand-name').innerHTML = escapeText(first) + (rest.length ? ' <span>' + escapeText(rest.join(' ')) + '</span>' : '');
          document.title = `Chat with ${candidateName}`;
          const title = document.getElementById('es-title');
          const text = document.getElementById('es-text');
          if (title) title.textContent = emptyTitle();
          if (text) text.textContent = emptyText();
        } catch (_) {
          thread.innerHTML = '<div id="empty-state"><h2>This chatbot isn\'t available</h2><p>The link may be wrong, or its owner has switched it off.</p></div>';
          input.disabled = true;
          sendBtn.disabled = true;
        }
      }

      // Minimal renderer for the chatbot's fixed output shape: an opening
      // line, blank-line-separated sections, **bold** labels, and "- " bullets.
      // Escapes HTML first so user/LLM text can never inject markup.
      function renderAssistantMarkdown(el, text){
        const escapeHtml = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const withBold = (s) => escapeHtml(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        el.innerHTML = '';
        const blocks = text.split(/\n\s*\n/);
        blocks.forEach((block) => {
          const lines = block.split('\n').filter((l) => l.trim());
          if (!lines.length) return;
          const isList = lines.every((l) => /^\s*-\s+/.test(l));
          if (isList) {
            const ul = document.createElement('ul');
            ul.style.cssText = 'margin:4px 0; padding-left:20px;';
            lines.forEach((l) => {
              const li = document.createElement('li');
              li.style.marginBottom = '3px';
              li.innerHTML = withBold(l.replace(/^\s*-\s+/, ''));
              ul.appendChild(li);
            });
            el.appendChild(ul);
          } else {
            lines.forEach((l) => {
              const p = document.createElement('div');
              p.style.marginBottom = '4px';
              p.innerHTML = withBold(l);
              el.appendChild(p);
            });
          }
        });
      }

      function addBubble(role, text, sources){
        // The welcome block and starter buttons only belong to an empty conversation.
        document.getElementById('empty-state')?.remove();
        const row = document.createElement('div');
        row.className = 'row ' + role;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'assistant') {
          renderAssistantMarkdown(bubble, text);
        } else {
          bubble.textContent = text;
        }
        row.appendChild(bubble);
        if (sources && sources.length) {
          const src = document.createElement('div');
          src.style.cssText = 'max-width:640px; margin-top:6px; font-size:11px; color:var(--text-dim);';
          src.textContent = 'Sources: ' + sources.map((s) => s.title).join(', ');
          row.appendChild(src);
        }
        thread.appendChild(row);
        thread.scrollTop = thread.scrollHeight;
      }

      function addTyping(){
        const row = document.createElement('div');
        row.className = 'row assistant';
        row.id = 'typing-row';
        row.innerHTML = '<div class="bubble">Thinking…</div>';
        thread.appendChild(row);
        thread.scrollTop = thread.scrollHeight;
      }

      function removeTyping(){
        const el = document.getElementById('typing-row');
        if (el) el.remove();
      }

      function renderEmptyState(){
        // The page ships with the empty state already in the HTML; only rebuild it
        // when missing, but always (re)attach the starter-button handlers.
        if (!document.getElementById('empty-state')) thread.innerHTML = `
          <div id="empty-state">
            <h2 id="es-title">${escapeText(emptyTitle())}</h2>
            <p id="es-text">${escapeText(emptyText())}</p>
            <div class="suggestions">
              <button class="suggestion" data-q="Hi!">Hi!</button>
              <button class="suggestion" data-q="Tell me about your experience">Tell me about your experience</button>
              <button class="suggestion" data-q="What projects have you built?">What projects have you built?</button>
              <button class="suggestion" data-q="How can I contact you?">How can I contact you?</button>
            </div>
          </div>`;
        document.querySelectorAll('.suggestion').forEach((b) => {
          b.onclick = () => { input.value = b.dataset.q; sendMessage(); };
        });
      }

      async function loadConversations(){
        if (!state.apiBase) return;
        try {
          const res = await fetch(buildUserUrl('/chat/conversations'), { headers: authHeaders() });
          if (!res.ok) return;
          const data = await res.json();
          convoList.innerHTML = '';
          data.forEach((item) => {
            const el = document.createElement('div');
            el.className = 'convo-item' + (item.id === state.conversationId ? ' active' : '');
            el.textContent = item.title || 'Untitled';
            el.onclick = () => openConversation(item.id, item.title);
            convoList.appendChild(el);
          });
        } catch (err) {
          console.warn('Conversations unavailable:', err);
        }
      }

      async function openConversation(id, title){
        state.conversationId = id;
        document.getElementById('convo-title').textContent = title || 'Conversation';
        thread.innerHTML = '';
        try {
          const res = await fetch(buildUserUrl('/chat/conversations/' + id), { headers: authHeaders() });
          if (!res.ok) return;
          const data = await res.json();
          data.messages.forEach((msg) => addBubble(msg.role, msg.content));
        } catch (err) {}
        loadConversations();
      }

      document.getElementById('new-chat').onclick = () => {
        state.conversationId = null;
        document.getElementById('convo-title').textContent = 'New conversation';
        renderEmptyState();
        loadConversations();
      };

      document.getElementById('settings-btn').onclick = () => overlay.classList.add('open');
      document.getElementById('settings-cancel').onclick = () => overlay.classList.remove('open');
      document.getElementById('settings-save').onclick = () => {
        state.apiBase = apiBaseInput.value.trim().replace(/\/$/, '');
        state.username = (jwtInput.value || '').trim() || visitorId();
        localStorage.setItem('jobhunt_api_base', state.apiBase);
        localStorage.setItem('jobhunt_username', state.username);
        overlay.classList.remove('open');
        refreshStatus();
        loadConversations();
      };

      function addStreamingBubble(){
        const row = document.createElement('div');
        row.className = 'row assistant';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = '';
        row.appendChild(bubble);
        thread.appendChild(row);
        thread.scrollTop = thread.scrollHeight;
        return { row, bubble };
      }

      function finalizeStreamingBubble(row, sources){
        if (!sources || !sources.length) return;
        const src = document.createElement('div');
        src.style.cssText = 'max-width:640px; margin-top:6px; font-size:11px; color:var(--text-dim);';
        src.textContent = 'Sources: ' + sources.map((s) => s.title).join(', ');
        row.appendChild(src);
      }

      // Parses a text/event-stream body read via fetch (POST-based SSE, so
      // the built-in EventSource -- GET only -- can't be used here).
      async function* parseSSE(response){
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split('\n\n');
          buffer = events.pop();
          for (const raw of events) {
            const lines = raw.split('\n');
            let event = 'message';
            let data = '';
            for (const line of lines) {
              if (line.startsWith('event:')) event = line.slice(6).trim();
              else if (line.startsWith('data:')) data += line.slice(5).trim();
            }
            if (data) yield { event, data: JSON.parse(data) };
          }
        }
      }

      async function sendMessage(){
        const message = input.value.trim();
        if (!message) return;
        if (!state.apiBase) {
          overlay.classList.add('open');
          return;
        }
        input.value = '';
        addBubble('user', message);
        sendBtn.disabled = true;

        let streamBubble = null;
        try {
          const res = await fetch(buildUserUrl('/chat/stream'), {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({ message, conversation_id: state.conversationId, target_username: candidate || null }),
          });

          if (!res.ok || !res.body) {
            const data = await res.json().catch(() => ({}));
            addBubble('assistant', data.detail || 'Could not process your request.');
            return;
          }

          let rawText = '';
          for await (const { event, data } of parseSSE(res)) {
            if (event === 'meta') {
              state.conversationId = data.conversation_id;
            } else if (event === 'token') {
              if (!streamBubble) streamBubble = addStreamingBubble();
              rawText += data.delta;
              streamBubble.bubble.textContent = rawText;
              thread.scrollTop = thread.scrollHeight;
            } else if (event === 'done') {
              if (!streamBubble) streamBubble = addStreamingBubble();
              renderAssistantMarkdown(streamBubble.bubble, data.message || rawText);
              finalizeStreamingBubble(streamBubble.row, data.sources);
              loadConversations();
            }
          }
        } catch (err) {
          if (!streamBubble) addBubble('assistant', 'Could not reach the backend. Check your API URL.');
        } finally {
          sendBtn.disabled = false;
        }
      }

      // Mobile drawer: the sidebar slides in over the chat on narrow screens.
      const sidebar = document.getElementById('sidebar');
      const menuBtn = document.getElementById('menu-btn');
      function setDrawer(open){
        document.body.classList.toggle('drawer-open', open);
        menuBtn.setAttribute('aria-expanded', String(open));
      }
      menuBtn.onclick = () => setDrawer(!document.body.classList.contains('drawer-open'));
      document.getElementById('drawer-backdrop').onclick = () => setDrawer(false);
      sidebar.addEventListener('click', (e) => {
        if (e.target.closest('.convo-item, #new-chat, #settings-btn')) setDrawer(false);
      });
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setDrawer(false); });
      // The full placeholder wraps onto a clipped second line at phone width.
      const narrow = window.matchMedia('(max-width: 768px)');
      const fullPlaceholder = input.placeholder;
      const syncPlaceholder = () => { input.placeholder = narrow.matches ? 'Ask me anything about my work…' : fullPlaceholder; };
      narrow.addEventListener('change', syncPlaceholder);
      syncPlaceholder();

      // Day/night toggle -- same saved setting (jobhunt_theme) as the main app.
      const themeBtn = document.getElementById('theme-btn');
      const SUN = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
      const MOON = '<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
      function paintThemeBtn(){
        const dark = document.documentElement.getAttribute('data-theme') !== 'light';
        themeBtn.innerHTML = dark ? SUN : MOON;
        themeBtn.setAttribute('aria-label', dark ? 'Switch to day mode' : 'Switch to night mode');
      }
      themeBtn.onclick = () => {
        const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('jobhunt_theme', next); } catch (_) {}
        paintThemeBtn();
      };
      paintThemeBtn();

      sendBtn.onclick = sendMessage;
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      apiBaseInput.value = state.apiBase;
      if (jwtInput) jwtInput.value = state.username;
      refreshStatus();
      renderEmptyState();
      loadCandidate();
      loadConversations();
    })();
  </script>
</body>
</html>
