<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JobHunt</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <script>
    // Apply the saved theme before first paint (default: dark) so there's no light flash.
    (function () {
      var theme = "dark";
      try { theme = localStorage.getItem("jobhunt_theme") || "dark"; } catch (e) {}
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div id="root"></div>
  <noscript>JobHunt needs JavaScript enabled to sign in.</noscript>

  <!-- React 18.3.1 + htm 3.1.1 (JSX-like tagged templates), vendored so the page
       works without any CDN and needs no build step. -->
  <script src="/static/vendor/react.production.min.js"></script>
  <script src="/static/vendor/react-dom.production.min.js"></script>
  <script src="/static/vendor/htm.umd.js"></script>
  <script src="/static/core.js"></script>
  <script src="/static/pages.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
